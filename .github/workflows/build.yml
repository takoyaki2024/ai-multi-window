name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify V1 workflow
        shell: powershell
        run: ./scripts/verify-v1.ps1

      - name: Publish
        run: dotnet publish -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: AiMultiWindow-win-x64
          path: bin/Release/net8.0-windows/win-x64/publish/
